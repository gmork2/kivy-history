[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kivy-history"
dynamic = ["version"]
description = "Kivy history inspired on the JavaScript History API"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Fernando Morente" }]
keywords = ["kivy", "history", "screenmanager", "navigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = ["kivy>=2.0.0"]

[project.urls]
Homepage = "https://github.com/gmork2/kivy-history"
Repository = "https://github.com/gmork2/kivy-history"
Documentation = "https://github.com/gmork2/kivy-history#readme"
Issues = "https://github.com/gmork2/kivy-history/issues"

[project.scripts]
kivy-history = "kivy_history.sample:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[tool.hatch.version]
path = "src/kivy_history/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kivy_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kivy_history"]
