name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon assets/icon.ico
          --name kivy-history-sample app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-history-sample-windows
          path: dist/kivy-history-sample.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kivy-history-sample.exe

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name kivy-history-sample app.py

      - name: Build AppImage
        run: ./tools/package_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-history-sample-linux
          path: kivy-history-sample-x86_64.AppImage

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: kivy-history-sample-x86_64.AppImage
